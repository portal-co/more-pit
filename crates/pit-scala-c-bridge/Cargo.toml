[package]
name = "pit-scala-c-bridge"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Scala native FFI bridge from pit-lang-generic wire layouts to C structs and @extern stubs"

[dependencies]
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
pit-core.workspace = true
pit-lang-generic = { path = "../pit-lang-generic" }

[dev-dependencies]
tempfile = "3"
