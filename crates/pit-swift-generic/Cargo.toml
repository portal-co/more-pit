[package]
name = "pit-swift-generic"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Generic PIT bindings for Swift (re-exports pit-lang-generic)"

[dependencies]
pit-lang-generic.workspace = true
portal-solutions-sdk = { workspace = true, optional = true }

[features]
unstable-sdk      = ["dep:portal-solutions-sdk", "pit-lang-generic/unstable-sdk"]
unstable-pcode    = ["pit-lang-generic/unstable-pcode"]
unstable-sdkcode  = ["unstable-sdk", "unstable-pcode", "portal-solutions-sdk/unstable-sdkcode"]
unstable-generics = ["pit-lang-generic/unstable-generics"]
